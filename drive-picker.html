<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Choose Drive Folder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1B2A4A;
      color: #FFFFFF;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    #status { padding: 24px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="status">Loading Drive folder picker&hellip;</div>

  <script>
    // Opened from the Exam Session Recorder app via Chrome Custom Tabs (not embedded in a
    // WebView) — Google's Picker requires a real browser session to silently confirm identity
    // alongside the OAuth token; a bare WebView has no session cookies and falls back to asking
    // the operator to type their password from scratch, which we deliberately avoid.
    //
    // The app's own OAuth access token is passed via the URL fragment (never sent to any server,
    // browser-local only — the same pattern classic OAuth "implicit flow" used) so this page
    // never needs a backend of its own. The picked folder (or cancellation) is sent back to the
    // app via a custom-scheme redirect the app's manifest intercepts.
    var API_KEY = 'AIzaSyCfN9vqOx5x5xJuXDf3gjlukA8w3Mkqw6g'; // Picker widget key — public, not a secret
    // The app's OAuth client id's leading numeric segment (public — the whole client id ships in
    // the app itself, this is just the project number half of it) — required by setAppId() below.
    var APP_ID = '654576988458';
    var REDIRECT_BASE = 'com.xri.examrecorder.picker://result';

    function showStatus(text) {
      document.getElementById('status').innerText = text;
    }

    function getAccessToken() {
      var hash = window.location.hash.replace(/^#/, '');
      var params = new URLSearchParams(hash);
      return params.get('access_token');
    }

    function redirectBack(paramsObj) {
      // Built by hand rather than via `new URLSearchParams(paramsObj)` (the object-literal
      // constructor form) — that form silently stringifies the whole object instead of
      // building key=value pairs on some older Chrome builds (confirmed on Android 8/API 26),
      // producing a redirect the app can't parse. encodeURIComponent works everywhere.
      var parts = [];
      for (var key in paramsObj) {
        if (Object.prototype.hasOwnProperty.call(paramsObj, key)) {
          parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(paramsObj[key]));
        }
      }
      window.location.href = REDIRECT_BASE + '?' + parts.join('&');
    }

    function createPicker() {
      var accessToken = getAccessToken();
      if (!accessToken) {
        showStatus('Missing access token — open this page from the app.');
        return;
      }

      // A single addView() with no parent set defaults to a flattened "everything you have
      // access to" listing (in practice: individually-shared folders), not a proper root browse
      // — so Shared Drives never appeared no matter what was enabled on that one view. Adding a
      // second, distinctly-labeled view is what makes Picker's nav sidebar appear at all, giving
      // the operator an explicit "Shared drives" section to switch into.
      var myDriveView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(true)
        .setParent('root')
        .setMode(google.picker.DocsViewMode.LIST)
        .setLabel('My Drive');

      var sharedDrivesView = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
        .setIncludeFolders(true)
        .setSelectFolderEnabled(true)
        .setEnableTeamDrives(true)
        .setMode(google.picker.DocsViewMode.LIST)
        .setLabel('Shared Drives');

      // setAppId() is what actually registers this app's drive.file access grant on whatever gets
      // picked below — without it, Picker still lets the operator browse and select a folder
      // (that part only needs the browser's own Google session), but the app's own OAuth token
      // is left with no real access to it: every later API call referencing that folder id 404s
      // as "not found", even though the id is completely correct and the folder is visibly there.
      var picker = new google.picker.PickerBuilder()
        .enableFeature(google.picker.Feature.SUPPORT_TEAM_DRIVES)
        .setAppId(APP_ID)
        .setOAuthToken(accessToken)
        .setDeveloperKey(API_KEY)
        .addView(myDriveView)
        .addView(sharedDrivesView)
        .setCallback(pickerCallback)
        .build();
      showStatus('');
      picker.setVisible(true);
    }

    function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
        var doc = data.docs[0];
        showStatus('Returning to the app…');
        // Shared Drive folders reached via a share link (rather than direct membership) need
        // this alongside the id for every later API call to find anything inside them — without
        // it, Drive silently returns empty results instead of an error, even though the id alone
        // is completely correct. Most items don't have one, hence the fallback to ''.
        var params = { folderId: doc.id, folderName: doc.name };
        if (doc.resourceKey) {
          params.resourceKey = doc.resourceKey;
        }
        redirectBack(params);
      } else if (data.action === google.picker.Action.CANCEL) {
        redirectBack({ cancelled: 'true' });
      }
    }

    function onApiLoad() {
      gapi.load('picker', { callback: createPicker });
    }
  </script>
  <script async defer src="https://apis.google.com/js/api.js?onload=onApiLoad"></script>
</body>
</html>
